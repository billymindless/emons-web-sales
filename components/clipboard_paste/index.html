<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>clipboard_paste</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "맑은 고딕", sans-serif;
  }
  #status {
    color: #546e7a;
    font-size: 12px;
    line-height: 1.4;
    padding: 2px 0;
    min-height: 16px;
  }
  #status.ok { color: #1b7f4b; }
  #status.err { color: #b3261e; }
</style>
</head>
<body>
<div id="status">이 화면에서 Ctrl+V 하면 이미지가 바로 첨부됩니다.</div>
<script>
(function () {
  var status = document.getElementById("status");
  var myKey = "";
  var lastSentId = "";

  function post(type, data) {
    var msg = Object.assign({ isStreamlitMessage: true, type: type }, data || {});
    try { window.parent.postMessage(msg, "*"); } catch (e) {}
  }
  function sendReady() { post("streamlit:componentReady", { apiVersion: 1 }); }
  function sendHeight(h) {
    post("streamlit:setFrameHeight", { height: h || 28 });
  }
  function sendValue(v) {
    post("streamlit:setComponentValue", { value: v, dataType: "json" });
  }

  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () {
        var s = String(r.result || "");
        var idx = s.indexOf(",");
        resolve(idx >= 0 ? s.substring(idx + 1) : "");
      };
      r.onerror = function (e) { reject(e); };
      r.readAsDataURL(blob);
    });
  }

  function pad2(n) { return String(n).padStart(2, "0"); }
  function tsStr() {
    var d = new Date();
    return "" + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate())
      + "_" + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
  }
  function rand(n) { return Math.random().toString(36).slice(2, 2 + (n || 6)); }

  function pickImageBlob(cd) {
    if (!cd) return null;
    var items = cd.items;
    if (items) {
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (it && it.kind === "file" && it.type && it.type.indexOf("image/") === 0) {
          var blob = it.getAsFile();
          if (blob) return blob;
        }
      }
    }
    var files = cd.files;
    if (files) {
      for (var j = 0; j < files.length; j++) {
        if (files[j] && files[j].type && files[j].type.indexOf("image/") === 0) {
          return files[j];
        }
      }
    }
    return null;
  }

  async function ingestBlob(blob, ev) {
    if (!blob) return false;
    if (ev && ev.preventDefault) ev.preventDefault();
    if (ev && ev.stopPropagation) ev.stopPropagation();
    try {
      var b64 = await blobToBase64(blob);
      if (!b64) return false;
      var mime = blob.type || "image/png";
      var ext = (mime.split("/")[1] || "png").split("+")[0].replace(/[^a-z0-9]/gi, "") || "png";
      var found = {
        id: Date.now() + "_" + rand(8),
        name: "paste_" + tsStr() + "_" + rand(4) + "." + ext,
        mime: mime,
        size: blob.size,
        b64: b64
      };
      if (found.id === lastSentId) return true;
      lastSentId = found.id;
      status.textContent = "이미지 붙여넣기 완료 · " + found.name;
      status.className = "ok";
      sendValue(found);
      sendHeight(28);
      return true;
    } catch (err) {
      status.textContent = "이미지 붙여넣기에 실패했습니다.";
      status.className = "err";
      return false;
    }
  }

  function onPaste(ev) {
    try {
      if (window.parent.__emonsPasteActive !== myKey) return;
    } catch (e) { return; }
    var blob = pickImageBlob(ev.clipboardData || window.clipboardData);
    if (!blob) return;
    ingestBlob(blob, ev);
  }

  function attachParentPaste() {
    try {
      var w = window.parent;
      var doc = w.document;
      w.__emonsPasteActive = myKey;
      doc.__emonsPasteHandlers = doc.__emonsPasteHandlers || {};
      if (myKey) doc.__emonsPasteHandlers[myKey] = onPaste;
      if (!doc.__emonsPasteBound) {
        doc.addEventListener("paste", function (ev) {
          var blob = pickImageBlob(ev.clipboardData || w.clipboardData);
          if (!blob) return;
          var k = w.__emonsPasteActive;
          var h = (doc.__emonsPasteHandlers || {})[k];
          if (typeof h === "function") h(ev);
        }, true);
        doc.__emonsPasteBound = true;
      }
    } catch (e) {
      status.textContent = "창 붙여넣기를 연결하지 못했습니다. 새로고침 후 다시 시도해 주세요.";
      status.className = "err";
    }
  }

  function pollParentPaste() {
    try {
      var p = window.parent.__emonsLastPaste;
      if (!p || !p.b64 || !p.id) return;
      if (p.id === lastSentId) return;
      if (p.key && myKey && p.key !== myKey) return;
      lastSentId = p.id;
      status.textContent = "이미지 붙여넣기 완료 · " + p.name;
      status.className = "ok";
      sendValue(p);
    } catch (e) {}
  }

  window.addEventListener("message", function (event) {
    var data = event.data || {};
    if (data.type !== "streamlit:render") return;
    var args = data.args || {};
    myKey = String(args.paste_key || args.key || myKey || "");
    attachParentPaste();
    sendHeight(28);
  });

  sendReady();
  sendHeight(28);
  setInterval(pollParentPaste, 250);
  setTimeout(function () { sendHeight(28); attachParentPaste(); }, 50);
  setTimeout(function () { sendHeight(28); }, 300);
})();
</script>
</body>
</html>
