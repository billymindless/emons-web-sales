# Render Blueprint — 이몬스 웹훅 서버(api.py) 배포 설정
# 사용법:
#   1. https://render.com 가입 후 New + → Blueprint 선택
#   2. 이 GitHub 저장소 연결 → render.yaml 자동 인식
#   3. 아래 환경변수를 Render 대시보드에서 직접 입력
#   4. 배포 완료 후 엔드포인트:
#      - https://<서비스명>.onrender.com/webhook/sms/deposit
#      - https://<서비스명>.onrender.com/webhook/solapi/friend-added
#      - https://<서비스명>.onrender.com/webhook/solapi/message-received
services:
  - type: web
    name: emons-sms-webhook
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SMS_WEBHOOK_TOKEN
        sync: false
      - key: SOLAPI_WEBHOOK_SECRET
        sync: false   # Solapi 콘솔 > 웹훅 > Secret HTTP Header 값과 동일하게 설정
      - key: IMWEB_WEBHOOK_TOKEN
        sync: false   # 아임웹 관리자 > 개발자 설정 > 웹훅에서 임의 설정한 보안 토큰
      - key: IMWEB_API_KEY
        sync: false   # 아임웹 관리자 > 개발자 설정 > API Key
      - key: IMWEB_API_SECRET
        sync: false   # 아임웹 관리자 > 개발자 설정 > API Secret
      - key: KAKAO_CHANNEL_URL
        sync: false   # 카카오채널 URL (예: https://pf.kakao.com/_xxxxx)
      - key: MOMO_APP_URL
        sync: false   # momo Streamlit 앱 도메인 (예: https://emons.streamlit.app)
      - key: CHANNEL_TALK_DEFAULT_STORE
        sync: false   # 채널톡 자동 가입 시 기본 store_name (예: '채널톡')
